services:
  node:
    build: ./node
    init: true
    cpus: ${CPUS:-4}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/io"]
      start_period: 30s
      start_interval: 1s
      interval: 1m

  python:
    build: ./python
    cpus: ${CPUS:-4}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"]
      start_period: 30s
      start_interval: 1s
      interval: 1m

  k6:
    image: grafana/k6:2.3.0
    depends_on:
      node: { condition: service_healthy }
      python: { condition: service_healthy }
    user: root
    entrypoint: ["sh", "/loadtest/run.sh"]
    environment:
      VUS: ${VUS:-8}
      DURATION: ${DURATION:-30s}
      CPUS: ${CPUS:-4}
    volumes:
      - ./loadtest:/loadtest:ro
      - ./reports:/reports
